name: CI
on:
  push:
    branches: [master, main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets
      - run: cargo test
      - name: Docs claims check (M5 credibility gate)
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            PYTHONUTF8=1 python3 scripts/check_docs_claims.py
          else
            PYTHONUTF8=1 python scripts/check_docs_claims.py
          fi
      - name: CLI end-to-end
        run: cargo test --test e2e_cli -- --nocapture
      - name: Official scip CLI lint (linux)
        if: runner.os == 'Linux'
        env:
          # Pinned scip-linux-amd64 v0.10.0 (fail-closed checksum).
          SCIP_SHA256: eeb28ebbff443c01609fb1691809958f3f0c7a8651af689a5bc8560061cd8ab0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/scip.tgz https://github.com/scip-code/scip/releases/download/v0.10.0/scip-linux-amd64.tar.gz
          echo "${SCIP_SHA256}  /tmp/scip.tgz" | sha256sum -c -
          tar -xzf /tmp/scip.tgz -C /tmp
          sudo install -m 755 /tmp/scip /usr/local/bin/scip
          cargo run --quiet -- --root fixtures/sample-app index --force
          cargo run --quiet -- --root fixtures/sample-app export scip --out /tmp/index.scip
          scip lint /tmp/index.scip
          # Adversarial fixture: same-line multi-ref must produce distinct ranges.
          mkdir -p /tmp/ag-sameline/src
          printf 'function a(){}; export function b(){ return a(1)+a(2); }\n' > /tmp/ag-sameline/src/mod.js
          cargo run --quiet -- --root /tmp/ag-sameline index --force
          cargo run --quiet -- --root /tmp/ag-sameline export scip --out /tmp/ag-sameline/index.scip
          scip lint /tmp/ag-sameline/index.scip
