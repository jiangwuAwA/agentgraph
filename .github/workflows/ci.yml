name: CI
on:
  push:
    branches: [master, main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test
      # Lint steps are advisory only — the repo is not yet clippy/fmt-clean,
      # so these must not be treated as a quality gate. continue-on-error is
      # intentional; flip it off once the tree is clean.
      - name: lint (non-blocking) — clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
      - name: lint (non-blocking) — fmt
        run: cargo fmt --check
        continue-on-error: true
