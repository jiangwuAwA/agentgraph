name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agentgraph-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: agentgraph-linux-x86_64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: agentgraph-linux-aarch64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # install.ps1 expects agentgraph-windows-x86_64.zip
            asset: agentgraph-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: agentgraph-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: agentgraph-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          stage=target/${{ matrix.target }}/release/agentgraph
          chmod +x "$stage"
          cp "$stage" "${{ matrix.asset }}"
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}.tar.gz" | tee "${{ matrix.asset }}.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release/agentgraph.exe"
          Copy-Item $src "${{ matrix.asset }}.exe"
          Compress-Archive -Path "${{ matrix.asset }}.exe" -DestinationPath "${{ matrix.asset }}.zip" -Force
          $h = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}.zip").Hash.ToLower()
          # Same "<hash>  <filename>" layout as sha256sum so installers can parse it.
          "$h  ${{ matrix.asset }}.zip" | Out-File -Encoding ascii "${{ matrix.asset }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate SHA256SUMS
        run: |
          cd dist
          # Fail closed if no per-asset checksums were produced.
          shopt -s nullglob
          sums=(*.sha256)
          if [ ${#sums[@]} -eq 0 ]; then
            echo "error: no .sha256 files found in dist/" >&2
            ls -la
            exit 1
          fi
          cat "${sums[@]}" > SHA256SUMS
          if [ ! -s SHA256SUMS ]; then
            echo "error: SHA256SUMS is empty" >&2
            exit 1
          fi
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
