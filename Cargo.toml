[package]
name = "agentgraph"
version = "0.1.0"
edition = "2021"
description = "Agent-native code understanding: symbol graph, call graph, impact analysis — CLI + MCP"
license = "MIT"

[[bin]]
name = "agentgraph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
walkdir = "2"

[profile.release]
lto = false
codegen-units = 16

