[package]
name = "agentgraph"
version = "0.5.1"
edition = "2021"
description = "Agent-native code understanding: symbol graph, call graph, impact analysis 鈥?CLI + MCP"
license = "MIT"

[[bin]]
name = "agentgraph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
notify = "7"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scip = "0.10"
protobuf = "3.7"
protobuf-json-mapping = "3.7"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
